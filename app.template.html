function conceptUnderstanding(c){if(c.lesson)return l6ConceptUnderstanding(c);return `<div class="concept-short" aria-label="概念快速理解"><section class="one-sentence"><h3 class="simple-label">一句话理解</h3><p>${esc(c.oneLine||c.back)}</p></section><section class="simple-story analogy-story"><h3 class="simple-label">打个比方</h3><p>${esc(c.analogy||c.example)}</p></section><section class="simple-story example-story"><h3 class="simple-label">看个例子</h3><p>${esc(c.simpleExample||c.example)}</p></section></div>${formulaBlocks(c.formulaHelp)}${symbolDetails([c.oneLine,c.analogy,c.simpleExample,c.front,c.cardBack].join(' '),'相关术语怎么理解？')}<details class="concept-deeper"><summary>展开解释、易错点与出处</summary><div class="deeper-content"><h3 class="simple-label">再解释一下</h3><p>${esc(c.explanation)}</p><h3 class="simple-label">别混淆</h3><p class="pitfall">${esc(c.pitfall)}</p>${symbolDetails([c.explanation,c.example,c.pitfall].join(' '),'相关术语怎么理解？')}<div class="source">${esc(c.source)}<br><button data-action="source" data-id="${c.id}">查看对应课程资料 ↗</button></div></div></details>`;}
function sourceMatches(q){return quizSource==='all'||(quizSource==='review'?q.origin==='review':q.origin!=='review');} function originLabel(q){return q.origin==='review'?'教授练习题':q.origin==='weekly'?'每周 Quiz 改编':'笔记自编';}
/* 正式考试结构：80 道单选，社会 20 · 发展 30 · 人格 30；从全部已收录题目中抽，按部分顺序排列 */
const FINAL_PLAN=[['social','社会心理学',20],['developmental','发展心理学',30],['personality','人格心理学',30]];
function finalSample(){return FINAL_PLAN.flatMap(([d,,n])=>balancedSample(questions.filter(q=>q.domain===d),n)).map(q=>q.id);}
function finalBreakdown(run){return FINAL_PLAN.map(([d,label])=>{const ids=run.ids.filter(id=>QM[id].domain===d),ok=ids.filter(id=>run.answers[id]===QM[id].answer).length;return {label,ok,total:ids.length};});}
function questionTable(q){const t=q.table;if(!t)return '';return `<div class="question-table-wrap"><table class="question-data"><caption>${bilingualText(t.captionEn,t.caption)}</caption><thead><tr>${t.headersEn.map((h,i)=>`<th scope="col">${bilingualText(h,t.headers[i])}</th>`).join('')}</tr></thead><tbody>${t.rowsEn.map((row,i)=>`<tr>${row.map((v,j)=>j===0?`<th scope="row">${bilingualText(v,t.rows[i][j])}</th>`:`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function questionExplanation(q){return `<div class="plain-explanation"><h3 class="simple-label">为什么选这个答案？</h3><p class="answer-reason">${esc(q.explanation)}</p>${q.optionExplanations?.length?`<details class="option-reasons"><summary>逐项看：对在哪，错在哪？</summary><dl>${q.options.map((text,i)=>`<div><dt>${bilingualText(q.optionsEn?.[i],text)}${i===q.answer?' <span class="check">✓ 正确</span>':''}</dt><dd>${esc(q.optionExplanations[i])}</dd></div>`).join('')}</dl></details>`:''}${symbolDetails([q.stem,q.stemEn,q.explanation,...q.options].join(' '),'相关术语怎么理解？')}</div>`;}
function reviewResults(){const list=filteredConcepts();if(!list.some(c=>c.id===selected))selected=list[0]?.id||null;const c=CM[selected];return `<div class="content-count">找到 ${list.length} 个知识点</div>${!c?empty('没有匹配的知识点','试试其他关键词，或切换到已收录的全部周次。',btn('清除筛选','clear-filters','','secondary')):`<div class="review-layout"><nav class="concept-list" aria-label="知识点列表">${list.map(n=>`<button class="concept-button ${c.id===n.id?'active':''}" data-action="concept" data-id="${n.id}" ${c.id===n.id?'aria-current="true"':''}><strong>${S.concepts[n.id]?.known?'<span class="known" aria-label="已掌握">✓</span>':''}${esc(n.title)}</strong><small>L${n.lectureId} · ${esc(n.english)}</small></button>`).join('')}</nav><article class="detail"><div class="eyebrow">LECTURE ${String(c.lectureId).padStart(2,'0')} / CONCEPT</div><div class="detail-head"><div><h2>${esc(c.title)}</h2><div class="english">${esc(c.english)}</div></div><button class="star ${S.concepts[c.id]?.star?'on':''}" data-action="star" data-id="${c.id}" aria-label="${S.concepts[c.id]?.star?'取消收藏':'收藏知识点'}" aria-pressed="${!!S.concepts[c.id]?.star}">${S.concepts[c.id]?.star?'★':'☆'}</button></div>${conceptUnderstanding(c)}<div class="detail-actions">${btn(S.concepts[c.id]?.known?icon('check')+'已掌握 · 撤销':'标记为已掌握','known',`data-id="${c.id}"`,S.concepts[c.id]?.known?'ghost':'')}${btn('练习相关题目','concept-quiz',`data-id="${c.id}"`,'secondary')}${btn('下一知识点 →','next-concept',`data-id="${c.id}"`,'secondary')}</div></article></div>`}`;}
function refreshReviewResults(){if(view!=='review')return;const results=document.getElementById('review-results');if(results)results.innerHTML=reviewResults();}
function reviewView(){return pageHead('知识点复习','先看一句话解释，再用比喻和例子理解。详细说明、易错点和出处可以展开查看。',scopeSwitch())+`<div class="toolbar"><div class="search">${icon('search')}<input id="concept-search" data-input="search" type="search" value="${esc(search)}" placeholder="搜索概念、英文术语或案例…" aria-label="搜索知识点"></div>${lectureSelect()}<label class="visually-hidden" for="review-filter">掌握状态</label><select id="review-filter" data-change="review-filter"><option value="all" ${reviewFilter==='all'?'selected':''}>全部知识点</option><option value="unknown" ${reviewFilter==='unknown'?'selected':''}>尚未掌握</option><option value="star" ${reviewFilter==='star'?'selected':''}>我的收藏</option></select></div><div id="review-results">${reviewResults()}</div>`;}
function resetDeck(){cardDeck=concepts.filter(c=>inScope(c)&&(cardFilter==='all'||cardFilter==='due'&&(!S.concepts[c.id]?.due||S.concepts[c.id].due<=Date.now())||cardFilter==='star'&&S.concepts[c.id]?.star)).map(c=>c.id);cardIndex=0;flipped=false;}
function cardsView(){const c=CM[cardDeck[cardIndex]];return pageHead('知识卡','先说出自己的答案，再翻卡核对。',scopeSwitch())+`<div class="toolbar">${lectureSelect('card-lecture')}<label class="visually-hidden" for="card-filter">卡片范围</label><select id="card-filter" data-change="card-filter"><option value="all" ${cardFilter==='all'?'selected':''}>全部卡片</option><option value="due" ${cardFilter==='due'?'selected':''}>待复习 + 新卡</option><option value="star" ${cardFilter==='star'?'selected':''}>收藏的卡片</option></select>${btn(icon('refresh')+'打乱顺序','shuffle-cards','','secondary')}</div>${!c?empty('这一组卡片已经完成','可以切换范围继续学习，或去做一组选择题检验理解。',btn('查看全部卡片','all-cards','','secondary')):`<div class="card-wrap"><div class="card-top"><span>L${c.lectureId} · ${esc(c.title)}</span><span>${cardIndex+1} / ${cardDeck.length}</span></div><div class="progress big"><i style="width:${pct(cardIndex,cardDeck.length)}%"></i></div><button class="flashcard ${flipped?'answer':''}" data-action="flip" aria-label="${flipped?'返回问题':'翻开答案'}"><span class="face-label">${flipped?'ANSWER / 核对答案':'RECALL / 主动回忆'}</span><span class="${flipped?'flash-answer':'flash-question'}">${esc(flipped?(c.cardBack||c.back):c.front)}</span><span class="flash-hint">${flipped?'点击卡片返回问题':'点击翻面，或按空格键'}</span></button>${symbolDetails([c.front,flipped?(c.cardBack||c.back):''].join(' '),'知识卡涉及的研究术语')}<div class="card-controls">${flipped?btn('还没记住','rate-card','data-rating="again"','secondary')+btn('有些模糊','rate-card','data-rating="hard"','secondary')+btn('已经掌握 '+icon('check'),'rate-card','data-rating="good"'):btn('← 上一张','prev-card',cardIndex===0?'disabled':'','secondary')+btn('翻开答案','flip')+btn('跳过 →','next-card','','secondary')}</div><div class="card-extra">${flipped?'重学：10 分钟后 · 模糊：1 天后 · 掌握：3 天后起，逐步延长':'先主动回忆，再决定自己的掌握程度。'}<br><button data-action="go-concept" data-id="${c.id}">回到知识点，查看完整案例</button></div></div>`}`;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function balancedSample(items,count){const groups=[...new Set(items.map(q=>q.lectureId))].map(id=>shuffle(items.filter(q=>q.lectureId===id)));const out=[];while(out.length<Math.min(count,items.length)&&groups.some(g=>g.length)){for(const g of shuffle(groups)){if(g.length&&out.length<count)out.push(g.pop());}}return shuffle(out);}
function startQuiz(ids,mode='practice',opts={}){if(!ids.length){toast('当前筛选下没有可练习的题目');return;}const run=()=>{S.quiz={ids:opts.keepOrder?[...ids]:shuffle(ids),mode,answers:{},order:Object.fromEntries(ids.map(id=>[id,shuffle([0,1,2,3])])),recorded:{},index:0,completed:false,start:Date.now(),deadline:mode==='mock'?Date.now()+Number(opts.minutes||mockMinutes)*60*1000:null,final:opts.final===true};quizDraft=null;view='quiz';save();shell();window.scrollTo({top:0});};if(S.quiz&&!S.quiz.completed)confirmDialog('开始新练习？','当前未完成的练习将被替换；已经提交的练习答案与错题记录会保留。',run);else run();}
function pool(){return questions.filter(q=>inScope(q)&&sourceMatches(q)&&(quizDifficulty==='all'||q.difficulty===quizDifficulty)&&(quizPool==='all'||quizPool==='new'&&!S.questions[q.id]?.attempts||quizPool==='wrong'&&S.questions[q.id]?.errors&&!S.questions[q.id]?.resolved));}
function quizView(){const q=S.quiz;if(q?.completed)return resultView();if(q)return currentQuestionView();return pageHead('选择题练习','先按周复习，也可以跨周检查概念辨析。',scopeSwitch())+`<div class="quiz-layout">${questionLanguageBar()}<section class="setup-panel"><h2>设置一组练习</h2><p class="subtitle">所有题目依据笔记自编，不是官方题库。英文始终显示；开启中文后上下对照。解析为直接、简短的中文。</p><div class="setup-fields"><div class="field"><label for="quiz-lecture">周次范围</label>${lectureSelect('quiz-lecture')}</div><div class="field"><label for="quiz-difficulty">难度</label><select id="quiz-difficulty" data-change="difficulty">${[['all','全部难度'],['基础','基础'],['应用','应用'],['辨析','辨析']].map(([v,t])=>`<option value="${v}" ${quizDifficulty===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="quiz-pool">作答状态</label><select id="quiz-pool" data-change="pool">${[['all','全部题目'],['new','尚未作答'],['wrong','待巩固错题']].map(([v,t])=>`<option value="${v}" ${quizPool===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="quiz-source">题目来源</label><select id="quiz-source" data-change="quiz-source">${[['all','全部来源'],['review','只做教授练习题'],['notes','只做笔记自编题']].map(([v,t])=>`<option value="${v}" ${quizSource===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="quiz-count">每组题数</label><select id="quiz-count" data-change="count">${['10','20','40','all'].map(n=>`<option value="${n}" ${quizCount===n?'selected':''}>${n==='all'?'当前范围全部':n+' 题'}</option>`).join('')}</select></div></div><p class="small muted">当前符合条件 ${pool().length} 道；不足时使用全部符合条件的题目。逐题与计时两种模式都遵循以上筛选。</p><div class="mode-grid"><div class="mode-card selected"><div class="eyebrow">PRACTICE / 逐题理解</div><h3>逐题练习</h3><p>提交后立即查看答案、选项解析和出处。错题自动记录。</p>${btn('开始练习 '+icon('arrow'),'start-practice',pool().length?'':'disabled')}</div><div class="mode-card"><div class="eyebrow">TIMED PRACTICE / 自选计时</div><h3>计时综合练习</h3><label for="mock-minutes" class="small">练习时长</label><select id="mock-minutes" data-change="mock-minutes">${['10','20','40','60'].map(n=>`<option value="${n}" ${mockMinutes===n?'selected':''}>${n} 分钟</option>`).join('')}</select><p>跨周选择时尽量均衡抽题；交卷后统一查看解析。不是正式考试时长。</p>${btn('开始计时练习','start-mock',pool().length?'':'disabled','secondary')}</div><div class="mode-card"><div class="eyebrow">FINAL EXAM / 正式考试结构</div><h3>期末模拟 · 80 题</h3><p>按正式考试比例抽题：社会心理学 20、发展心理学 30、人格心理学 30，按部分顺序排列，不受上面的筛选影响。交卷后分部分出分。</p><label for="final-minutes" class="small">考试时长</label><select id="final-minutes" data-change="final-minutes">${['90','120','150'].map(n=>`<option value="${n}" ${finalMinutes===n?'selected':''}>${n} 分钟</option>`).join('')}</select><p class="small muted">正式考试时长以考试处通知为准。</p>${btn('开始期末模拟','start-final','','secondary')}</div></div><p class="small muted no-margin">计时包括离开页面的时间，到时自动交卷；刷新可继续。${btn('查看范围说明','exam-info','','ghost compact')}</p></section></div>`;}
function currentQuestionView(){const run=S.quiz,q=QM[run.ids[run.index]],answered=Object.hasOwn(run.answers,q.id),show=run.mode==='practice'&&answered,chosen=answered?run.answers[q.id]:quizDraft,ok=chosen===q.answer;return pageHead(run.final?'期末模拟':run.mode==='mock'?'计时模拟':'逐题练习',run.final?`80 题 · ${({social:'社会心理学',developmental:'发展心理学',personality:'人格心理学'})[q.domain]}部分 · 交卷后查看解析`:run.mode==='mock'?'当前筛选范围 · 自选计时 · 交卷后查看解析':'提交答案后查看解析，错误会自动记录。',btn('返回设置','leave-quiz','','secondary'))+`<div class="quiz-layout">${questionLanguageBar()}<div class="quiz-meta"><div class="quiz-position">第 <strong>${run.index+1}</strong> / ${run.ids.length} 题 · 已提交 ${Object.keys(run.answers).length} 题</div>${run.mode==='mock'?'<div id="timer" class="timer" aria-label="剩余时间"></div>':'<span class="small muted">不计时 · 练习模式</span>'}</div><div class="progress big"><i style="width:${pct(Object.keys(run.answers).length,run.ids.length)}%"></i></div><article class="question-box"><div class="question-labels"><span class="tag">LECTURE ${q.lectureId}</span><span class="tag">${esc(q.difficulty)}</span><span class="tag">${({social:'社会心理学',developmental:'发展心理学',personality:'人格心理学'})[q.domain]||'概念'}</span><span class="tag">${originLabel(q)}</span></div><h2 id="question-stem">${questionText(q)}</h2>${questionTable(q)}${questionReading(q)}${symbolDetails([q.stem,q.stemEn,...q.options,...(q.optionsEn||[])].join(' '),'题目涉及的研究术语')}<div class="options" role="group" aria-labelledby="question-stem">${run.order[q.id].map((o,i)=>`<button class="option ${chosen===o?'selected':''} ${show&&o===q.answer?'correct':''} ${show&&chosen===o&&!ok?'wrong':''}" data-action="choose" data-value="${o}" aria-pressed="${chosen===o}" ${show?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span class="option-copy">${optionText(q,o)}</span>${show&&o===q.answer?`<span class="correct-label">${bilingualText("Correct","正确答案")}</span>`:''}</button>`).join('')}</div>${show?`<div class="feedback ${ok?'':'wrong'}" role="status"><strong>${ok?'✓ 回答正确':'这题先记下来，再巩固一次'}</strong>${questionExplanation(q)}<div class="source">${esc(q.source)}<br><button data-action="source-question" data-id="${q.id}">${q.origin==='weekly'?'查看改编说明':'查看对应笔记'}</button> · <button data-action="quiz-concept" data-id="${q.conceptId}">复习相关知识点</button></div></div>`:''}<div class="quiz-footer"><span class="muted">快捷键 <kbd>1–4</kbd> 选项 · <kbd>Enter</kbd> 提交 / 继续</span><div class="inline-row">${run.mode==='mock'?btn('保存本题并继续','submit-answer',chosen===null?'disabled':'')+btn('交卷','finish-quiz','','secondary'):show?btn(run.index===run.ids.length-1?'查看本组结果':'下一题 '+icon('arrow'),'next-question'):btn('提交答案','submit-answer',chosen===null?'disabled':'')}</div></div></article>${run.mode==='mock'?`<div class="answer-grid" aria-label="模拟题号导航">${run.ids.map((id,i)=>`<button class="${Object.hasOwn(run.answers,id)?'answered':''} ${i===run.index?'current':''}" data-action="jump-question" data-index="${i}" aria-label="第 ${i+1} 题${Object.hasOwn(run.answers,id)?'，已保存':'，未保存'}">${i+1}</button>`).join('')}</div><p class="small muted">选定选项后需点“保存本题并继续”。题号可自由切换；已保存的答案可修改。</p>`:''}</div>`;}
function record(q,answer){const prev=S.questions[q.id]||{attempts:0,correct:0,errors:0,resolved:false,lastWrong:0,lastWrongAnswer:null},ok=answer===q.answer;prev.attempts++;prev.correct+=Number(ok);prev.errors+=Number(!ok);prev.last=Date.now();prev.lastAnswer=answer;if(!ok){prev.lastWrong=Date.now();prev.lastWrongAnswer=answer;prev.resolved=false;}else if(prev.errors)prev.resolved=true;S.questions[q.id]=prev;studied();}
function submitAnswer(){const run=S.quiz;if(!run||run.completed)return;const id=run.ids[run.index],answer=quizDraft??run.answers[id];if(answer===undefined||answer===null)return;if(run.mode==='practice'&&Object.hasOwn(run.answers,id))return;run.answers[id]=answer;if(run.mode==='practice'){record(QM[id],answer);run.recorded[id]=true;}else if(run.index<run.ids.length-1)run.index++;quizDraft=null;save();shell();}
function finishQuiz(auto=false){const run=S.quiz;if(!run||run.completed)return;const finish=()=>{for(const id of run.ids)if(!run.recorded[id]){if(Object.hasOwn(run.answers,id)){record(QM[id],run.answers[id]);run.recorded[id]=true;}else{record(QM[id],null);run.recorded[id]=true;}}run.completed=true;studied();save();shell();if(auto)toast('时间已到，模拟练习已自动交卷');};if(auto||run.mode==='practice')finish();else confirmDialog('确认交卷？',`已保存 ${Object.keys(run.answers).length}/${run.ids.length} 题。未作答计为错误并收入错题集；当前尚未保存的选项不会提交。`,finish);}
function resultView(){const run=S.quiz,n=run.ids.filter(id=>run.answers[id]===QM[id].answer).length;return pageHead('这一组，完成了','正确与错误都值得回看：理解原因，比记住字母更重要。',btn('设置新练习','new-quiz','','secondary'))+`<div class="quiz-layout">${questionLanguageBar()}<section class="setup-panel"><div class="result-head"><div class="eyebrow">${run.final?'FINAL EXAM MOCK':run.mode==='mock'?'MOCK EXAM':'PRACTICE'} / RESULT</div><div class="score">${n}<span> / ${run.ids.length}</span></div><p class="muted">本组正确率 ${pct(n,run.ids.length)}% · ${run.ids.length-n} 道需再巩固</p>${run.final?`<p class="muted">${finalBreakdown(run).map(b=>`${b.label} ${b.ok} / ${b.total}`).join(' · ')}<br>${pct(n,run.ids.length)>=50?'达到 50% 及格线（期末是 hurdle，必须 ≥50%）':'未达到 50% 及格线：期末是 hurdle，必须 ≥50% 才能通过本课'}</p>`:''}<div class="inline-row" style="justify-content:center">${btn('重练本组错题','retry-result',run.ids.length===n?'disabled':'')}${btn('打开错题集','nav','data-view="mistakes"','secondary')}</div></div></section><div class="results-list">${run.ids.map((id,i)=>{const q=QM[id],ans=run.answers[id],ok=ans===q.answer;return `<details class="result-row"><summary><span class="${ok?'check':'cross'}">${ok?'✓':'✕'}</span><span class="result-question"><span class="result-number">${i+1}.</span>${questionText(q)}</span></summary>${questionTable(q)}<p class="muted">你的答案：${optionText(q,ans)}<br>正确答案：${optionText(q,q.answer)}</p>${questionExplanation(q)}<div class="source">${esc(q.source)}<br><button data-action="go-concept" data-id="${q.conceptId}">查看相关知识点</button></div></details>`;}).join('')}</div></div>`;}
function mistakesView(){const list=questions.filter(q=>inScope(q)&&S.questions[q.id]?.errors&&(mistakeFilter==='all'||mistakeFilter==='active'&&!S.questions[q.id].resolved||mistakeFilter==='resolved'&&S.questions[q.id].resolved)).sort((a,b)=>S.questions[b.id].lastWrong-S.questions[a.id].lastWrong);return pageHead('错题集','保留错误轨迹，重练答对后自动移入“已巩固”。',btn('重练待巩固错题 '+icon('refresh'),'retry-mistakes',activeMistakes().filter(inScope).length?'':'disabled'))+`${questionLanguageBar()}<div class="toolbar">${scopeSwitch()}${lectureSelect('mistake-lecture')}<label class="visually-hidden" for="mistake-filter">错题状态</label><select id="mistake-filter" data-change="mistake-filter"><option value="active" ${mistakeFilter==='active'?'selected':''}>待巩固</option><option value="resolved" ${mistakeFilter==='resolved'?'selected':''}>已巩固</option><option value="all" ${mistakeFilter==='all'?'selected':''}>全部历史错题</option></select></div><div class="content-count">当前筛选下 ${list.length} 道错题</div>${list.length?list.map(q=>{const st=S.questions[q.id];return `<article class="mistake-card"><div class="mistake-top"><span>L${q.lectureId} · ${esc(q.difficulty)} · 累计错 ${st.errors} 次</span><span>${st.resolved?'✓ 已巩固':'待巩固'} · ${date(st.lastWrong)}</span></div><h3>${questionText(q)}</h3>${questionTable(q)}<div class="mistake-answer"><span class="wrong-text">上次错误：${optionText(q,st.lastWrongAnswer)}</span></div><details><summary>查看正确答案与解析</summary><p><strong>正确答案：</strong>${optionText(q,q.answer)}</p>${questionExplanation(q)}<div class="source">${esc(q.source)}</div></details><div class="mistake-footer">${btn('重做这道题','retry-one',`data-id="${q.id}"`,'secondary compact')}${btn('复习关联知识','go-concept',`data-id="${q.conceptId}"`,'ghost compact')}${st.resolved?btn('移回待巩固','unresolve',`data-id="${q.id}"`,'ghost compact'):''}</div></article>`;}).join(''):empty(mistakeFilter==='resolved'?'还没有已巩固的错题':'这里暂时没有错题','可以开始练习，或者切换 Lecture 和复习范围。',btn('去做选择题','nav','data-view="quiz"','secondary'))}`;}
function settingsView(){return pageHead('备份与资料','保存自己的进度，后续更新继续使用。')+`<div class="settings-grid"><section class="settings-card"><h2>进度备份</h2><p>进度保存在当前设备、当前浏览器。移动文件、换浏览器或清理数据，可能无法读取原进度。</p><p>备份包含掌握状态、收藏、错题和当前练习。更新软件或换设备前，请先导出；新版打开后再导入。其他课程的备份不能导入 PSYC1004。</p><div class="settings-actions">${btn(icon('download')+'导出备份','export')}${btn(icon('upload')+'导入备份','import','','secondary')}</div><div class="divider"></div><h3>快捷键</h3><p class="small no-margin">知识卡：空格翻面，← / → 切换<br>选择题：1–4 选项，Enter 提交 / 继续<br>输入框和弹窗中不会触发学习快捷键</p></section><section class="settings-card"><h2>收录内容与更新</h2><p>总计规划 ${D.plannedWeeks} 周，已收录 ${D.lectures.length} 周、${concepts.length} 个知识点和 ${questions.length} 道自编单选题。尚未收录周次不计入题库、知识卡或正确率。</p><p>后续把新的 Lecture PPT、文字稿或笔记发到本聊天，由我补入同一套软件。现有知识点和题目编号保持稳定，备份可带入更新版。</p>${btn('查看内容与更新说明','exam-info','','secondary')}<p class="reminder-label">知识卡掌握状态为自评；正确率包含重练。模拟结果不保证预测正式成绩。考试范围和安排以学校最新通知为准。</p></section></div><section class="settings-card" style="margin-top:22px"><h2>课程文字资料库</h2><p>编号按你提供的 L1–L9 文件对应周次。B 编号是软件的内容块定位号，不是 Word 页码；文字框和表格文字也已提取。L1–L8 为原 DOCX；L9 为课件逐页文字及课堂文字稿补充。图示排版请以对应原文件为准。</p><div class="source-list">${D.lectures.map(l=>`<div class="source-row"><div><strong>第 ${l.id} 周 · ${esc(l.title)}</strong><small>${esc(l.file)}</small></div>${btn('阅读文字','full-source',`data-id="${l.id}"`,'secondary compact')}</div>`).join('')}</div></section><section class="settings-card" style="margin-top:22px"><h2>清空本机学习进度</h2><p>仅清空这款软件的掌握状态、错题和练习记录，不删除题库或原始笔记。清空前建议导出备份。</p>${btn('清空学习进度','reset','','danger')}</section>`;}
function openDialog(title,body,actions=''){const dialog=document.getElementById('dialog');dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="icon-button" data-action="close-dialog" aria-label="关闭弹窗">${icon('close')}</button></div><div class="dialog-body">${body}</div>${actions?`<div class="dialog-actions">${actions}</div>`:''}`;if(!dialog.open)dialog.showModal();}
let confirmedAction=null;
function confirmDialog(title,body,fn){confirmedAction=fn;openDialog(title,`<p>${esc(body)}</p>`,btn('取消','close-dialog','','secondary')+btn('确认','confirm'));}
function showSource(id,isQuestion=false){const c=isQuestion?QM[id]:CM[id];if(!c)return;const l=LM[c.lectureId],source=c.source||'';const ranges=[...source.matchAll(/B(\d{4})\s*[–—−-]\s*B?(\d{4})/g)].map(m=>[Number(m[1]),Number(m[2])]);if(!ranges.length){for(const n of source.matchAll(/B(\d{4})/g))ranges.push([Number(n[1]),Number(n[1])]);}const blocks=(l.sourceBlocks||[]).filter(b=>ranges.some(([a,z])=>b.id>=a&&b.id<=z));openDialog('原笔记对应内容',`<p class="muted small">${esc(l.file)}<br>${esc(source)}<br>B 编号是软件定位号，不是页码；文字包含文本框及表格。</p>${blocks.length?blocks.map(b=>`<div class="source-paragraph"><strong>B${String(b.id).padStart(4,'0')}</strong><p>${esc(b.text).replace(/\n/g,'<br>')}</p></div>`).join(''):'<p>这一定位未找到文字，请在资料库阅读本讲的完整提取内容。</p>'}<p class="small muted">生活案例和选择题为练习改编，不是教授原话或官方考试题。</p>`);}
function examInfo(){openDialog('内容范围与后续更新',`<p><strong>规划 ${D.plannedWeeks} 周，已收录 ${D.lectures.length} 周。</strong>当前按你提供的文件夹编号对应周次；第 1–4 周为社会心理学，第 5–8 周为发展心理学，第 9 周起为人格心理学。</p><p><strong>期末考试：</strong>线下进行，占总成绩 40%，是 hurdle（必须 ≥50% 才能通过本课）。共 80 道单选：社会心理学 20 题、发展心理学 30 题、人格心理学 30 题；答错不扣分，每题都要作答。</p><p>题库包括依据笔记自编的题目，以及教授发布的 48 道期末练习题（标注「教授练习题」，最接近正式考试风格）。「选择题练习」里的「期末模拟 · 80 题」按正式考试比例抽题。「边练边学」按讲义顺序把 12 讲过一遍，每题都有解题步骤。</p><p>L10–L12 的笔记依据录课文字稿和 PPT 整理，原有编号与进度格式保持稳定。</p><p class="small muted">内容版本：${esc(D.contentVersion)}。本软件不需要账号、不上传内容。iPad 同一 Wi-Fi 访问方式见压缩包内说明；不是跨设备自动同步。</p>`);}
function downloadBackup(){const payload={app:'PSYC1004 Offline Study Desk',exportedAt:new Date().toISOString(),preferences:{theme:themePreference,showChinese},state:S},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PSYC1004-学习进度-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出学习进度备份');}
function goConcept(id){if(!CM[id])return;const c=CM[id];if(!scopeMatches(c.lectureId))scope='all';lecture=String(c.lectureId);reviewFilter='all';search='';selected=id;S.lastConcept=id;view='review';save();shell();window.scrollTo({top:0});}
const drawerMedia=matchMedia('(max-width:1100px)');
function syncDrawer(){const aside=document.querySelector('.sidebar');if(!aside)return;const hidden=drawerMedia.matches&&!mobileOpen;aside.inert=hidden;aside.setAttribute('aria-hidden',String(hidden));}
if(drawerMedia.addEventListener)drawerMedia.addEventListener('change',()=>{mobileOpen=false;shell();});
function navigate(v){view=v;mobileOpen=false;quizDraft=null;if(v==='cards')resetDeck();shell();document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0});}
function action(name,el){switch(name){
 case'nav':navigate(el.dataset.view);break;
 case'learn-lecture':learnLecture=Number(el.dataset.id);LR=null;shell();window.scrollTo({top:0});break;
 case'learn-continue':{const L=learnCurrent();let pi=L.points.findIndex(p=>learnStat(p).done<p.items.length);if(pi<0){pi=0;L.points.forEach(learnReset);save();}const qi=Math.max(0,L.points[pi].items.findIndex(it=>!S.learn[it.id]));learnOpen(pi,qi);break;}
 case'learn-point':{const p=learnCurrent().points[Number(el.dataset.id)];learnReset(p);save();learnOpen(Number(el.dataset.id),0);break;}
 case'learn-choose':{const p=learnCurrent().points[LR.pi],it=p.items[LR.qi];if(LR.resp!==null)break;LR.resp=Number(el.dataset.value);S.learn[it.id]={ok:LR.resp===it.answer,t:Date.now()};save();shell();break;}
 case'learn-next':learnOpen(LR.pi,LR.qi+1);break;
 case'learn-next-point':learnOpen(LR.pi+1,0);break;
 case'learn-redo':{const pi=LR.pi;learnReset(learnCurrent().points[pi]);save();learnOpen(pi,0);break;}
 case'learn-quit':LR=null;shell();window.scrollTo({top:0});break;
 case'pending-week':openDialog('第 '+el.dataset.id+' 周待更新','<p>尚未收到本周课程材料；现在没有虚构的知识卡或题目。</p><p>后续将新 Lecture 发到本聊天即可，由我加入更新版。更新前先导出备份，新版再导入。</p>');break;
 case'menu':mobileOpen=!mobileOpen;shell();break;
 case'scope':scope=el.dataset.value;lecture='all';selected=null;if(view==='cards')resetDeck();shell();break;
 case'open-lecture':if(!LM[Number(el.dataset.id)]){toast('本周尚未收录');break;}if(!scopeMatches(Number(el.dataset.id)))scope='all';lecture=el.dataset.id;view='review';search='';reviewFilter='all';selected=null;shell();window.scrollTo({top:0});break;
 case'concept':selected=el.dataset.id;S.lastConcept=selected;save();{const top=document.querySelector('.concept-list')?.scrollTop||0;shell();document.querySelector('.concept-list')?.scrollTo({top});}break;
 case'clear-filters':search='';lecture='all';reviewFilter='all';shell();break;
 case'star':{const c=conceptStat(CM[el.dataset.id]);c.star=!c.star;save();shell();break;}
 case'known':{const c=conceptStat(CM[el.dataset.id]);c.known=!c.known;c.last=Date.now();c.due=c.known?Date.now()+7*86400000:0;studied();save();shell();toast(c.known?'已标记掌握':'已撤销掌握标记');break;}
 case'next-concept':{const list=filteredConcepts(),i=list.findIndex(c=>c.id===selected);selected=list[(i+1)%list.length]?.id;shell();break;}
 case'go-concept':case'quiz-concept':goConcept(el.dataset.id);break;
 case'concept-quiz':{const id=el.dataset.id,qs=questions.filter(q=>q.conceptId===id);startQuiz(qs.map(q=>q.id));break;}
 case'start-cards':view='cards';cardFilter='due';lecture='all';resetDeck();shell();break;
 case'flip':if(cardDeck[cardIndex]){flipped=!flipped;shell();}break;
 case'prev-card':if(cardIndex>0){cardIndex--;flipped=false;shell();}break;
 case'next-card':cardIndex++;flipped=false;shell();break;
 case'all-cards':cardFilter='all';resetDeck();shell();break;
 case'shuffle-cards':cardDeck=shuffle(cardDeck);cardIndex=0;flipped=false;shell();break;
 case'rate-card':{if(!flipped)return;const id=cardDeck[cardIndex],c=conceptStat(CM[id]),r=el.dataset.rating;c.reviews++;c.rating=r;c.known=r==='good';c.last=Date.now();c.due=Date.now()+(r==='again'?600000:r==='hard'?86400000:Math.min(30,3*Math.pow(2,Math.min(c.reviews-1,4)))*86400000);studied();save();cardIndex++;flipped=false;shell();break;}
 case'quick-quiz':lecture='all';startQuiz(shuffle(questions.filter(q=>scopeMatches(q.lectureId))).slice(0,10).map(q=>q.id));break;
 case'start-practice':startQuiz(shuffle(pool()).slice(0,quizCount==='all'?Infinity:Number(quizCount)).map(q=>q.id));break;
 case'start-mock':{const candidates=pool(),count=quizCount==='all'?candidates.length:Number(quizCount);startQuiz(balancedSample(candidates,count).map(q=>q.id),'mock');break;}  case'start-final':startQuiz(finalSample(),'mock',{minutes:finalMinutes,keepOrder:true,final:true});break;
 case'choose':{if(S.quiz?.mode==='practice'&&Object.hasOwn(S.quiz.answers,S.quiz.ids[S.quiz.index]))return;quizDraft=Number(el.dataset.value);if(S.quiz?.mode==='mock'&&Object.hasOwn(S.quiz.answers,S.quiz.ids[S.quiz.index])){delete S.quiz.answers[S.quiz.ids[S.quiz.index]];save();}shell();break;}
 case'submit-answer':submitAnswer();break;
 case'next-question':if(S.quiz.index<S.quiz.ids.length-1){S.quiz.index++;quizDraft=null;save();shell();window.scrollTo({top:0});}else finishQuiz();break;
 case'jump-question':S.quiz.index=Number(el.dataset.index);quizDraft=null;save();shell();break;
 case'finish-quiz':finishQuiz();break;
 case'leave-quiz':confirmDialog('结束这组练习？','练习模式中已提交的答案会保留。未交卷的模拟不会计分；此操作将放弃本组未完成练习。',()=>{S.quiz=null;quizDraft=null;save();shell();});break;
 case'new-quiz':S.quiz=null;save();shell();break;
 case'retry-result':{const ids=S.quiz.ids.filter(id=>S.quiz.answers[id]!==QM[id].answer);startQuiz(ids);break;}
 case'retry-mistakes':startQuiz(activeMistakes().filter(inScope).map(q=>q.id));break;
 case'retry-one':startQuiz([el.dataset.id]);break;
 case'unresolve':S.questions[el.dataset.id].resolved=false;save();shell();break;
 case'source':showSource(el.dataset.id);break;
 case'source-question':showSource(el.dataset.id,true);break;
 case'full-source':{const l=LM[el.dataset.id];openDialog(`L${l.id} · 原笔记文字`,`<p class="muted small">${esc(l.file)}<br>文字提取版，B 编号为软件定位号；含文本框与表格文字。原始图像和公式排版以 DOCX 为准。</p>${l.sourceText.split('\n').map(line=>`<div class="source-paragraph">${esc(line)}</div>`).join('')}`);break;}
 case'exam-info':examInfo();break;
 case'export':downloadBackup();break;
 case'import':document.getElementById('import-file').click();break;
 case'reset':confirmDialog('清空本机进度？','此操作清空本软件的知识卡状态、收藏、答题、错题和当前练习。原笔记和题库不受影响。如无导出备份，无法恢复。',()=>{S=fresh();save();shell();toast('本软件的学习进度已清空；可通过已有备份恢复。');});break;
 case'close-dialog':document.getElementById('dialog').close();confirmedAction=null;break;
 case'confirm':{const fn=confirmedAction;confirmedAction=null;document.getElementById('dialog').close();fn?.();break;}
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el);else if(mobileOpen&&!e.target.closest('.sidebar')){mobileOpen=false;shell();}});
document.addEventListener('change',e=>{const v=e.target.value;switch(e.target.dataset.change){case'theme':setTheme(v);return;case'show-chinese':setQuestionLanguage(e.target.checked);return;case'lecture':lecture=v;selected=null;if(view==='cards')resetDeck();break;case'review-filter':reviewFilter=v;break;case'card-filter':cardFilter=v;resetDeck();break;case'difficulty':quizDifficulty=v;break;case'pool':quizPool=v;break;case'quiz-source':quizSource=v;break;case'count':quizCount=v;break;case'mock-minutes':mockMinutes=v;break;case'final-minutes':finalMinutes=v;break;case'mistake-filter':mistakeFilter=v;break;default:return;}shell();});
searchInputController=window.PSYC_IME.attachImeSearch({root:document,getValue:()=>search,onSearch:value=>{search=value;refreshReviewResults();}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>5*1024*1024)throw Error('备份文件过大（上限 5 MB）');const data=JSON.parse(await file.text());if(data.app!=='PSYC1004 Offline Study Desk')throw Error('这不是本软件的进度备份');const next=validate(data.state);confirmDialog('导入并替换进度？',`文件含 ${Object.keys(next.concepts).length} 条知识卡状态、${Object.keys(next.questions).length} 条题目记录。将替换本机现有进度，建议先导出当前进度。`,()=>{S=next;if(['light','dark','system'].includes(data.preferences?.theme))setTheme(data.preferences.theme);if(typeof data.preferences?.showChinese==='boolean')setQuestionLanguage(data.preferences.showChinese);quizDraft=null;save();shell();toast('学习进度已导入');});}catch(err){toast('无法导入：'+err.message);}});
document.addEventListener('keydown',e=>{if(searchInputController?.shouldIgnoreShortcut(e))return;if(e.key==='Escape'&&mobileOpen){mobileOpen=false;shell();return;}if(document.getElementById('dialog').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest('button,summary,a')&&(e.code==='Space'||e.key==='Enter'))return;if(view==='cards'){if(e.code==='Space'){e.preventDefault();action('flip',{});}if(e.key==='ArrowRight'){e.preventDefault();action('next-card',{});}if(e.key==='ArrowLeft'){e.preventDefault();action('prev-card',{});}}if(view==='quiz'&&S.quiz&&!S.quiz.completed){const q=S.quiz,answered=Object.hasOwn(q.answers,q.ids[q.index]);if(/^[1-4]$/.test(e.key)&&!(q.mode==='practice'&&answered)){e.preventDefault();action('choose',{dataset:{value:q.order[q.ids[q.index]][Number(e.key)-1]}});}if(e.key==='Enter'){e.preventDefault();action(q.mode==='practice'&&answered?'next-question':'submit-answer',{});}}});
function updateTimer(){const q=S.quiz;if(q?.mode!=='mock'||q.completed)return;const remaining=Math.max(0,q.deadline-Date.now()),el=document.getElementById('timer');if(el){el.textContent=`${String(Math.floor(remaining/60000)).padStart(2,'0')}:${String(Math.floor(remaining/1000)%60).padStart(2,'0')}`;el.classList.toggle('urgent',remaining<300000);}if(remaining===0){document.getElementById('dialog').close();finishQuiz(true);}}
setInterval(updateTimer,1000);
window.addEventListener('storage',e=>{if(e.key===CHINESE_KEY){showChinese=e.newValue==='true';applyQuestionLanguage();return;}if(e.key===THEME_KEY){themePreference=['light','dark','system'].includes(e.newValue)?e.newValue:'system';applyTheme();return;}if(e.key!==KEY||!e.newValue)return;try{const other=validate(JSON.parse(e.newValue));if(other.updatedAt>S.updatedAt){S=other;quizDraft=null;shell();toast('已同步另一个窗口的本机进度');}}catch{}});
// Progressive enhancement: no dependency on WebMCP in offline browsers.
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const register=tool=>{try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}};
 register({name:'get_study_progress',description:'Read local PSYC1004 study progress without changing it.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({concepts:concepts.length,mastered:concepts.filter(c=>S.concepts[c.id]?.known).length,activeMistakes:activeMistakes().length,questions:questions.length})});
 register({name:'open_study_concept',description:'Open one source-based concept in the visible review view; saves last opened concept but does not mark mastery.',inputSchema:{type:'object',properties:{conceptId:{type:'string'}},required:['conceptId'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input.conceptId!=='string'||!CM[input.conceptId]||Object.keys(input).some(k=>k!=='conceptId'))throw Error('Unknown conceptId');goConcept(input.conceptId);return{opened:input.conceptId};}});
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
shell();
})();
</script>
